name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/random-bot:${{ github.sha }}

    - name: Update GitOps Repo
      env:
        GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        git clone https://$DOCKER_USERNAME:$GITOPS_TOKEN@github.com/goncharukinna/bots-gitops.git
        cd bots-gitops
        # Здесь мы меняем путь на папку random-bot
        sed -i "s|image: .*random-bot.*|image: $DOCKER_USERNAME/random-bot:$IMAGE_TAG|" manifests/random-bot/deployment.yaml
        git config user.email "ci@github.com"
        git config user.name "GitHub Actions"
        git add manifests/random-bot/deployment.yaml
        
        # ПРОВЕРКА: если есть изменения, делаем коммит и пуш
        if git diff --staged --quiet; then
          echo "Нет изменений для коммита, пропускаем шаг."
        else
          git commit -m "ci: update random-bot image tag to $IMAGE_TAG [skip ci]"
          git push origin main
        fi
